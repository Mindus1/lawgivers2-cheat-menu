name: Bug report
description: Something in the Cheat Menu doesn't work or breaks the game.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us which cheat misbehaves and what the game showed. If you switched a cheat off and didn't get your old value back, include the `[Cheats]` part of `BepInEx\config\mindus.lawgivers2.cheatmenu.cfg`.
  - type: input
    id: game-version
    attributes:
      label: Game version
      description: Shown at the bottom of the main menu.
      placeholder: "0.17.2"
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Cheat Menu version
      description: Shown next to the name in the Mods window, or in the release you downloaded.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: Every other mod in `BepInEx\plugins`, with versions if you know them.
      placeholder: |
        Mod Library 1.1.0
        Mod Manager 1.1.0
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from starting the game. Say if it happens every time or only sometimes.
      placeholder: |
        1. Load a save
        2. Switch on Unlimited money
        3. Spend some money ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Drag `BepInEx\LogOutput.log` in here. It's overwritten every time the game starts, so grab it right after the problem.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If something looks wrong, a screenshot helps a lot.
